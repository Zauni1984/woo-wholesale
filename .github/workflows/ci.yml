name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP files
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -not -path './build/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          echo "All PHP files pass syntax check."
      - name: Check translation coverage of both plugins
        run: php bin/check-translations.php
      - name: Check that the generated language files are up to date
        run: |
          set -e
          php bin/make-translations.php
          if ! git diff --quiet -- languages partner-plugin/languages; then
            echo "The language files are out of date. Run php bin/make-translations.php and commit the result."
            git --no-pager diff --stat -- languages partner-plugin/languages
            exit 1
          fi
          echo "Language files are up to date."
      - name: Check that both plugins carry the same version
        run: |
          set -e
          MASTER=$(grep -oP "define\( 'WWPRO_VERSION', '\K[^']+" woo-wholesale.php)
          PARTNER=$(grep -oP "define\( 'WWPART_VERSION', '\K[^']+" partner-plugin/woo-wholesale-partner.php)
          echo "supplier: $MASTER, partner: $PARTNER"
          test "$MASTER" = "$PARTNER"

  package:
    name: Build plugin zips
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin packages
        run: bash bin/build-zip.sh
      # Upload the staging directory of each plugin, which holds only that plugin
      # folder (the zips themselves go to dist/). GitHub wraps every artifact in a
      # zip of its own, so a download is exactly one zip containing the plugin
      # folder and installs via Plugins > Add New > Upload. Uploading the built zip
      # instead would produce a zip inside a zip, which WordPress rejects with
      # "No valid plugins were found".
      - name: Upload the supplier plugin
        uses: actions/upload-artifact@v4
        with:
          name: woo-wholesale
          path: build/master
      - name: Upload the partner plugin
        uses: actions/upload-artifact@v4
        with:
          name: woo-wholesale-partner
          path: build/partner
